<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ausbildungsvergütung SHK Saarland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101b24;
    --panel:#16232e;
    --grid:rgba(237,234,226,0.08);
    --copper:#c17a3d;
    --copper-light:#e0a868;
    --paper:#edeae2;
    --steel:#6e8ca0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    display:flex;
    justify-content:center;
    padding:40px 18px;
  }
  .card{
    width:100%;
    max-width:760px;
    background:var(--panel);
    border:1px solid var(--grid);
    border-radius:6px;
    padding:26px 26px 20px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    font-weight:700;
    margin:0 0 18px;
    color:var(--paper);
  }
  .views{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    background:var(--bg);
    padding:4px;
    border-radius:6px;
    border:1px solid var(--grid);
  }
  .view-btn{
    flex:1;
    text-align:center;
    padding:8px 4px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    color:var(--steel);
    background:transparent;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    transition:all .2s;
    user-select:none;
  }
  .view-btn:hover{ color:var(--paper); }
  .view-btn.active{
    color:var(--bg);
    background:var(--copper-light);
    font-weight:600;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:22px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 4px;
    border-radius:4px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--steel);
    background:transparent;
    border:1px solid var(--grid);
    transition:all .2s;
    user-select:none;
  }
  .tab:hover{ color:var(--paper); }
  .tab.active{
    color:var(--bg);
    background:var(--copper-light);
    border-color:var(--copper-light);
    font-weight:600;
  }
  svg{ display:block; width:100%; height:auto; overflow:visible; }
  .gridline{ stroke:var(--grid); stroke-width:1; }
  .axis-label{ fill:var(--steel); font-size:10.5px; font-family:'IBM Plex Mono',monospace; }
  .x-label{ fill:var(--steel); font-size:11px; font-family:'IBM Plex Mono',monospace; text-anchor:middle; }
  .line-path{ fill:none; stroke:var(--copper-light); stroke-width:2.5; }
  .area-path{ fill:url(#areaFill); opacity:0.9; }
  .pt{ fill:var(--copper-light); stroke:var(--bg); stroke-width:2.5; }
  .pt-val{ fill:var(--paper); font-size:13px; font-weight:600; text-anchor:middle; font-family:'IBM Plex Mono',monospace; }
  .dash-seg{ stroke-dasharray:5 5; opacity:0.55; }
  .bar{ fill:var(--copper); }
  .bar.hi{ fill:var(--copper-light); }
  .bar-val{ fill:var(--paper); font-size:13px; font-weight:600; text-anchor:middle; font-family:'IBM Plex Mono',monospace; }
  .bar-label{ fill:var(--steel); font-size:11px; text-anchor:middle; font-family:'IBM Plex Mono',monospace; }
  .hint{
    font-size:11px;
    color:var(--steel);
    margin:14px 2px 0;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Ausbildungsvergütung SHK Saarland</h1>

  <div class="views" id="views">
    <div class="view-btn" data-view="trend">Entwicklung je Lehrjahr</div>
    <div class="view-btn active" data-view="current">Alle Lehrjahre im Vergleich</div>
  </div>

  <div id="trendView" style="display:none;">
    <div class="tabs" id="tabs"></div>
    <svg id="chart" viewBox="0 0 680 320"></svg>
  </div>

  <div id="currentView">
    <div class="tabs" id="periodTabs"></div>
    <svg id="barChart" viewBox="0 0 680 300"></svg>
  </div>
</div>

<script>
const PERIODS = [
  { label:"vor\n07/2018", values:[550,560,640,680] },
  { label:"ab\n07/2018",  values:[565,575,655,695] },
  { label:"ab\n07/2025",  values:[800,900,1000,1100] }
];
const TABS = ["1. Lehrjahr","2. Lehrjahr","3. Lehrjahr","4. Lehrjahr"];

let current = 0;
const tabsEl = document.getElementById('tabs');
const svg = document.getElementById('chart');

TABS.forEach((t,i)=>{
  const d = document.createElement('div');
  d.className = 'tab' + (i===0?' active':'');
  d.textContent = t;
  tabsEl.appendChild(d);
});

function updateTabs(){
  [...tabsEl.children].forEach((el,i)=> el.classList.toggle('active', i===current));
}
tabsEl.querySelectorAll('.tab').forEach((el,i)=>{
  el.onclick = ()=>{ current=i; render(); updateTabs(); };
});

function render(){
  const W=680,H=320,padL=54,padR=20,padT=24,padB=44;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const values = PERIODS.map(p=>p.values[current]);
  const maxV = 1150, minV = 500;

  const x = i => padL + (i/(PERIODS.length-1))*plotW;
  const y = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

  let grid = '';
  const steps = [500,650,800,950,1100];
  steps.forEach(v=>{
    grid += `<line class="gridline" x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}"/>`;
    grid += `<text class="axis-label" x="${padL-10}" y="${y(v)+4}" text-anchor="end">${v}€</text>`;
  });

  let xlabels = '';
  PERIODS.forEach((p,i)=>{
    const lines = p.label.split('\n');
    xlabels += `<text class="x-label" x="${x(i)}" y="${H-padB+18}">${lines[0]}</text>`;
    if(lines[1]) xlabels += `<text class="x-label" x="${x(i)}" y="${H-padB+31}">${lines[1]}</text>`;
  });

  let linePath = 'M ' + values.map((v,i)=>`${x(i)},${y(v)}`).join(' L ');
  let areaPath = `M ${x(0)},${y(minV)} L ` + values.map((v,i)=>`${x(i)},${y(v)}`).join(' L ') + ` L ${x(values.length-1)},${y(minV)} Z`;

  let points = '';
  values.forEach((v,i)=>{
    points += `<circle class="pt" cx="${x(i)}" cy="${y(v)}" r="5"/>`;
    points += `<text class="pt-val" x="${x(i)}" y="${y(v)-14}">${v.toLocaleString('de-DE')} €</text>`;
  });

  svg.innerHTML = `
    <defs>
      <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c17a3d" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#c17a3d" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}
    <path class="area-path" d="${areaPath}"/>
    <path class="line-path" d="${linePath}"/>
    ${points}
    ${xlabels}
  `;
}

updateTabs();
render();

/* ---------- view switching ---------- */
const viewsEl = document.getElementById('views');
const trendViewEl = document.getElementById('trendView');
const currentViewEl = document.getElementById('currentView');

viewsEl.querySelectorAll('.view-btn').forEach(btn=>{
  btn.onclick = ()=>{
    viewsEl.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(btn.dataset.view==='trend'){
      trendViewEl.style.display='block';
      currentViewEl.style.display='none';
    } else {
      trendViewEl.style.display='none';
      currentViewEl.style.display='block';
      renderBars();
    }
  };
});

/* ---------- "Alle Lehrjahre im Vergleich" bar view ---------- */
let currentPeriod = 2; // default: ab 07/2025
const periodTabsEl = document.getElementById('periodTabs');
const barSvg = document.getElementById('barChart');

PERIODS.forEach((p,i)=>{
  const d = document.createElement('div');
  d.className = 'tab' + (i===currentPeriod?' active':'');
  d.textContent = p.label.replace('\n',' ');
  d.onclick = ()=>{
    currentPeriod = i;
    periodTabsEl.querySelectorAll('.tab').forEach((el,j)=> el.classList.toggle('active', j===i));
    renderBars();
  };
  periodTabsEl.appendChild(d);
});

function renderBars(){
  const W=680,H=300,padL=54,padR=20,padT=24,padB=40;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const values = PERIODS[currentPeriod].values;
  const maxV = 1150;
  const gap = 26;
  const barW = (plotW - gap*(values.length-1)) / values.length;

  const y = v => padT + plotH - (v/maxV)*plotH;

  let grid='';
  [0,300,600,900,1150].forEach(v=>{
    grid += `<line class="gridline" x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}"/>`;
    grid += `<text class="axis-label" x="${padL-10}" y="${y(v)+4}" text-anchor="end">${v}€</text>`;
  });

  let bars='';
  values.forEach((v,i)=>{
    const bx = padL + i*(barW+gap);
    const by = y(v);
    const bh = (padT+plotH) - by;
    bars += `<rect class="bar${i===values.length-1?' hi':''}" x="${bx}" y="${by}" width="${barW}" height="${bh}" rx="3"/>`;
    bars += `<text class="bar-val" x="${bx+barW/2}" y="${by-10}">${v.toLocaleString('de-DE')} €</text>`;
    bars += `<text class="bar-label" x="${bx+barW/2}" y="${H-padB+18}">${i+1}. Lehrjahr</text>`;
  });

  barSvg.innerHTML = `${grid}${bars}`;
}

renderBars();
</script>
</body>
</html>
